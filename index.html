<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery - CodeAlpha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">Image Gallery</h1>

    <!-- Filter Buttons -->
    <div class="filter-btns">
        <button class="btn active" data-category="all">All</button>
        <button class="btn" data-category="nature">Nature</button>
        <button class="btn" data-category="animals">Animals</button>
        <button class="btn" data-category="tech">Tech</button>
    </div>

    <!-- Gallery Container -->
    <div class="gallery">
        <img src="images/img1.jpg" class="gallery-item" data-category="nature" alt="">
        <img src="images/img2.jpg" class="gallery-item" data-category="animals" alt="">
        <img src="images/img3.jpg" class="gallery-item" data-category="tech" alt="">
        <img src="images/img4.jpg" class="gallery-item" data-category="nature" alt="">
        <img src="images/img5.jpg" class="gallery-item" data-category="animals" alt="">
        <img src="images/img6.jpg" class="gallery-item" data-category="tech" alt="">
    </div>

    <!-- Lightbox -->
    <div class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-img" src="" alt="selected image">
        <div class="controls">
            <span class="prev">&#10094;</span>
            <span class="next">&#10095;</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
